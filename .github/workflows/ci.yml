name: CI

on:
  push:
    branches: [trunk]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install "conan>=2,<3"

      - name: Install LLVM 22
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all

      - name: Select GCC 14
        run: |
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install dependencies
        run: >
          conan install
          --build=missing
          -s build_type=${{ matrix.build_type }}
          .

      # TODO: support different build profiles
      - name: Configure CMake
        run: >
          cmake
          -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm
          -DCMAKE_PROGRAM_PATH=/usr/lib/llvm-22/bin
          --preset conan-release

      - name: Build
        run: cmake --build --preset conan-release

      - name: Run unit tests
        run: ctest --preset conan-release

      - name: Run C' test suite
        run: cmake --build --preset conan-release --target check
